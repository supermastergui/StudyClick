<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>StudyClick</title>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial;
    background: linear-gradient(135deg, #e3f2fd, #fce4ec);
}

/* ===== 顶部 ===== */
.header {
    text-align: center;
    padding: 50px 20px 20px;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    color: #333;
}

.header p {
    color: #666;
    margin-top: 10px;
}

/* ===== 主体容器 ===== */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* ===== 卡片网格 ===== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* ===== 学科卡片 ===== */
.card {
    background: #fff;
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

/* 图标 */
.icon {
    font-size: 40px;
    margin-bottom: 10px;
}

/* 标题 */
.card h3 {
    margin: 10px 0 5px;
    color: #333;
}

/* 描述 */
.card p {
    color: #777;
    font-size: 14px;
}

/* ===== 页脚 ===== */
.footer {
    text-align: center;
    margin: 40px 0;
    color: #888;
    font-size: 14px;
}
</style>

</head>
<body>

<div class="header">
    <h1>🧠 StudyClick</h1>
    <p>点击式学习系统 · 多学科刷题平台</p>
</div>

<div class="container">

    <div class="grid">

        <!-- 英语 -->
        <div class="card" onclick="go('subjects/english287.html')">
            <div class="icon">📘</div>
            <h3>英语 (1-287) <br>基础版</h3>
            <p>单词记忆 / 词汇测试</p>
        </div>

        <div class="card" onclick="go('subjects/english-287-advanced.html')">
            <div class="icon">📘</div>
            <h3>英语 (1-287) <br><h2><b>进阶版</b></h2></h3>
            <p>单词记忆 / 词汇测试</p>
        </div>

        <div class="card" onclick="go('subjects/english288-388.html')">
            <div class="icon">📘</div>
            <h3>英语 (288-388) <br><h2><b>进阶版</b></h2></h3>
            <p>单词记忆 / 词汇测试</p>
        </div>

        <!-- 语文 -->
        <div class="card" onclick="go('subjects/chinese.html')">
            <div class="icon">📖</div>
            <h3>语文</h3>
            <p>文学常识 / 阅读训练</p>
        </div>

        <!-- 化学 -->
        <div class="card" onclick="go('subjects/chemistry.html')">
            <div class="icon">🧪</div>
            <h3>化学</h3>
            <p>知识点 / 公式记忆</p>
        </div>

        <!-- 以后扩展 -->
        <div class="card" onclick="comingSoon()">
            <div class="icon">➕</div>
            <h3>更多学科</h3>
            <p>持续更新中...</p>
        </div>

    </div>

</div>

<div class="footer">
    <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer"></a> 
</div>

<script>
function go(url){
    window.location.href = url;
}

function comingSoon(){
    alert("该学科正在开发中 🚧");
}
</script>

</body>
</html>
