<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学题库转换工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #e8eaf6 0%, #fce4ec 50%, #e0f2f1 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 780px; margin: 0 auto; }
.header { text-align: center; padding: 30px 20px 20px; }
.header h1 { font-size: 24px; color: #333; margin-bottom: 6px; }
.header .subtitle { color: #888; font-size: 13px; margin-bottom: 30px; }
textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; font-family: monospace; resize: vertical; margin-bottom: 12px; }
button { padding: 10px 24px; border: none; border-radius: 20px; background: #5c6bc0; color: #fff; font-size: 14px; cursor: pointer; font-weight: 500; margin-bottom: 12px; }
button:hover { background: #3f51b5; }
pre { background: #fff; padding: 16px; border-radius: 10px; font-size: 13px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.footer { text-align: center; margin-top: 30px; color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🧪 化学题库转换工具</h1><div class="subtitle">将化学方程式转为题库格式</div></div>
<textarea id="input" placeholder="粘贴化学方程式..."></textarea>
<button onclick="convert()">🔄 转换</button>
<pre id="output"></pre>
<div class="footer">StudyClick · 开发工具</div>
</div>

<script>
function cleanLatex(str){
    return str
        .replace(/\$\$\\boldsymbol{|}\$\$/g, "")
        .replace(/\\xlongequal.*?{(.*?)}/g, "→")
        .replace(/\\Delta/g, "加热")
        .replace(/\\text{(.*?)}/g, "$1")
        .replace(/_/g, "")
        .replace(/\\uparrow/g, "↑")
        .replace(/\\downarrow/g, "↓")
        .replace(/\s+/g, " ")
        .trim();
}

function convert(){
    let input = document.getElementById("input").value;
    let lines = input.split("\n");
    let result = [];
    let currentTitle = "";
    lines.forEach(line=>{
        line = line.trim();
        if(line.match(/^\d+\./)){
            currentTitle = line.replace(/^\d+\.\s*/, "").replace("：","");
        }
        if(line.includes("$$")){
            let eq = cleanLatex(line);
            result.push({ title: currentTitle, answer: eq });
        }
    });
    document.getElementById("output").innerText = JSON.stringify(result, null, 2);
}
</script>
</body>
</html>
