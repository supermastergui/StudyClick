            font-weight: bold;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }
        .option {
            padding: 12px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            text-align: center;
        }
        .option:hover:not(.disabled) {
            background-color: #f0f4f8;
            border-color: #3498db;
        }
        .option.disabled {
            cursor: not-allowed;
        }
        .option.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .option.wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

            background: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;

            color: #2c3e50;
            margin-bottom: 20px;
        }

            line-height: 1.8;

            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;

        ];

        // 随机打乱数组
        function shuffle(arr) {
            let newArr = [...arr];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // 随机抽取10道题
        let selectedQuestions = shuffle(questionBank).slice(0, 10);
        let correctCount = 0;
        let answeredCount = 0;

        // 渲染题目
        const container = document.getElementById('questions-container');
        selectedQuestions.forEach((item, index) => {
            const shuffledOpts = shuffle(item.options);
            const qBox = document.createElement('div');
            qBox.className = 'question-box';
            qBox.innerHTML = `
                <div class="question-title">${index + 1}. ${item.q}</div>
                <div class="options">
                    ${shuffledOpts.map(opt => `
                        <div class="option" data-answer="${opt === item.a}">
                            ${opt}
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(qBox);
        });

        // 绑定点击事件
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', function() {
                if (this.classList.contains('disabled')) return;

                const isCorrect = this.dataset.answer === 'true';
                const parent = this.closest('.question-box');
                const allOpts = parent.querySelectorAll('.option');

                allOpts.forEach(o => o.classList.add('disabled'));

                if (isCorrect) {
                    this.classList.add('correct');
                    correctCount++;
                } else {
                    this.classList.add('wrong');
                    allOpts.forEach(o => {
                        if (o.dataset.answer === 'true') o.classList.add('correct');
                    });
                }

                answeredCount++;
                if (answeredCount === selectedQuestions.length) {
                    showResult();
                }
            });
        });

        // 显示成绩
        function showResult() {
            const rate = ((correctCount / selectedQuestions.length) * 100).toFixed(1);
            document.getElementById('resultText').innerHTML = `
                总题数：${selectedQuestions.length} 道<br>
                答对题数：${correctCount} 道<br>
                正确率：${rate}%
            `;
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
