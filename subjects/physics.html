<head>

    <style>

body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #e8eaf6 0%, #fce4ec 50%, #e0f2f1 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 780px; margin: 0 auto; }
.header { text-align: center; padding: 30px 20px 20px; }

<body>
<div class="container">
<div class="header"><h1>⚡ 初中物理公式随机自测</h1><div class="subtitle">随机抽题 · 点击作答 · 即时判分（上海教程，g取9.8 N/kg）</div></div>
<div class="control-bar">
<label for="countSelect">题量：</label>
<select id="countSelect"><option value="10" selected>10 题</option><option value="15">15 题</option><option value="20">20 题</option><option value="30">30 题</option></select>
<button class="btn-start" onclick="restart()">🔄 生成试卷</button>
</div>
<div class="progress-wrap"><div class="progress-text" id="progressText">未开始</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
<div id="quiz"></div>
<div class="result-panel" id="resultPanel"><h2 id="resultTitle"></h2><div class="result-stats"><div class="stat-item"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总题数</div></div><div class="stat-item"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答对</div></div><div class="stat-item"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正确率</div></div></div><div class="result-grade" id="resultGrade"></div></div>
<div class="footer"><button class="btn-home" onclick="location.href='../index.html'">🏠 返回首页</button>&nbsp;StudyClick · 点击式学习系统</div>
</div>

    <script>
        // 初中物理公式题库（上海教程，g=9.8 N/kg）
        const questionBank = [
            // ==================== 一、运动学 ====================
            {
                q: "速度公式 v = s/t 中，s 表示什么？",
                a: "路程",
                options: ["路程", "位移", "时间", "速率"]

            {
                q: "速度的单位是 m/s，换算为 km/h 时 1 m/s 等于多少？",

                options: ["3.6 km/h", "0.28 km/h", "1 km/h", "36 km/h"]

            {
                q: "由 v = s/t 变形求路程的公式是？",
                a: "s = vt",
                options: ["s = vt", "s = v/t", "s = t/v", "s = v + t"]

            {
                q: "由 v = s/t 变形求时间的公式是？",

            // ==================== 二、密度 ====================

            },
            {
                q: "由 ρ = m/V 变形求质量的公式是？",

                options: ["m = ρV", "m = ρ/V", "m = V/ρ", "m = ρ + V"]
            },
            {
                q: "关于密度，下列说法正确的是？",
                a: "密度是物质的特性，与质量、体积无关",

            // ==================== 三、重力 ====================

            {
                q: "液体压强公式是？",

            {

            {
                q: "p = F/S 和 p = ρgh 分别适用于？",

            // ==================== 六、功和功率 ====================

            // ==================== 七、简单机械 ====================
            {
                q: "杠杆平衡条件（杠杆原理）的公式是？",

            },
            {
                q: "滑轮组中，绳子自由端移动距离 s 与物体上升高度 h 的关系是？",

            },
            {
                q: "不计绳重和摩擦时，滑轮组拉力 F 等于？",

            {

                options: ["η = W有/W总 × 100%", "η = W总/W有 × 100%", "η = W有 × W总", "η = W总 - W有"]

            // ==================== 八、热学 ====================
            {
                q: "热量计算公式 Q = cmΔt 中，c 的单位是？",

                options: ["J/(kg·℃)", "J/℃", "J/kg", "W/(m·℃)"]
            },
            {
                q: "上海教程中，水的比热容 c水 是多少？",
                a: "4.2×10³ J/(kg·℃)",
                options: ["4.2×10³ J/(kg·℃)", "4.2 J/(kg·℃)", "4.2×10⁴ J/(kg·℃)", "1.0×10³ J/(kg·℃)"]
            },
            {
                q: "固体、液体燃料完全燃烧放热公式是？",
                a: "Q放 = mq",
                options: ["Q放 = mq", "Q放 = qV", "Q放 = cmΔt", "Q放 = Pt"]
            },
            {
                q: "气体燃料完全燃烧放热公式是？",
                a: "Q放 = qV",
                options: ["Q放 = qV", "Q放 = mq", "Q放 = cmΔt", "Q放 = Pt"]
            },
            {
                q: "不计热量损失时，热平衡条件是？",
                a: "Q吸 = Q放",
                options: ["Q吸 = Q放", "Q吸 > Q放", "Q吸 < Q放", "Q吸 + Q放 = 0"]
            },
            {
                q: "热机效率的公式是？",
                a: "η = Q有效/Q放 × 100%",
                options: ["η = Q有效/Q放 × 100%", "η = Q放/Q有效 × 100%", "η = Q有效 × Q放", "η = Q放 - Q有效"]

            // ==================== 九、光学与声学 ====================
            {
                q: "光在真空中的速度 c 是？",
                a: "3×10⁸ m/s",
                options: ["3×10⁸ m/s", "3×10⁵ m/s", "340 m/s", "3×10¹⁰ m/s"]
            },
            {
                q: "电磁波公式 c = λf 中，λ 表示什么？",

                options: ["波长", "频率", "周期", "振幅"]
            },
            {
                q: "光的反射定律：反射角与入射角的关系是？",

            {
                q: "15℃时声音在空气中的传播速度是？",

                options: ["340 m/s", "3×10⁸ m/s", "1500 m/s", "20 m/s"]
            },
            {
                q: "回声测距时，距离 s 的计算公式是？",
                a: "s = vt/2（声音往返）",
                options: ["s = vt/2（声音往返）", "s = vt", "s = v/t", "s = 2vt"]
            },

            // ==================== 十、电学——欧姆定律 ====================

                q: "欧姆定律的公式是？",

                options: ["I = U/R", "U = I/R", "R = IU", "I = R/U"]

            {
                q: "关于电阻 R = U/I，下列说法正确的是？",
                a: "R是导体属性，与U、I无关",
                options: ["R是导体属性，与U、I无关", "R与U成正比", "R与I成反比", "R随U增大而增大"]

            // ==================== 补充题 ====================

            },
            {
                q: "串联电路中总电阻等于？",
                a: "R = R₁ + R₂ + ... + Rn",
                options: ["R = R₁ + R₂ + ... + Rn", "R = 1/R₁ + 1/R₂ + ...", "R = R₁ × R₂", "R = R₁ - R₂"]
            },
            {
                q: "Q吸 = cm(t - t₀) 中，t₀ 表示什么？",
                a: "物体的初温",
                options: ["物体的初温", "物体的末温", "环境温度", "标准温度"]
            }
        ];

let QUESTION_COUNT = 10, quizData = [], correctCount = 0, answeredCount = 0;
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function loadQuiz(){document.getElementById("quiz").innerHTML="";document.getElementById("resultPanel").classList.remove("show");document.getElementById("progressText").textContent="0 / "+QUESTION_COUNT;document.getElementById("progressFill").style.width="0%";quizData=shuffle(questionBank).slice(0,QUESTION_COUNT);correctCount=0;answeredCount=0;let qe=document.getElementById("quiz");quizData.forEach((item,idx)=>{let opts=shuffle(item.options);let qDiv=document.createElement("div");qDiv.className="question";let td=document.createElement("div");td.className="q-title";td.innerHTML=`<span class="q-num">${idx+1}</span><span class="q-word">${item.q}</span>`;qDiv.appendChild(td);let og=document.createElement("div");og.className="options-grid";opts.forEach(opt=>{let btn=document.createElement("button");btn.className="option-btn";btn.textContent=opt;btn.addEventListener("click",()=>handleAnswer(idx,opt,qDiv,og,item.a));og.appendChild(btn)});qDiv.appendChild(og);qe.appendChild(qDiv)})}
function handleAnswer(idx,chosen,qDiv,og,answer){if(qDiv.classList.contains("done"))return;let btns=og.querySelectorAll(".option-btn");btns.forEach(btn=>{btn.disabled=true;if(btn.textContent===answer)btn.classList.add("correct")});if(chosen!==answer){btns.forEach(btn=>{if(btn.textContent===chosen)btn.classList.add("wrong")})}else{correctCount++}qDiv.classList.add("done");answeredCount++;let pt=document.getElementById("progressText"),pf=document.getElementById("progressFill");pt.textContent=answeredCount+" / "+QUESTION_COUNT;pf.style.width=(answeredCount/QUESTION_COUNT*100)+"%";if(answeredCount===QUESTION_COUNT)setTimeout(showResult,300)}
function showResult(){let t=QUESTION_COUNT,r=Math.round(correctCount/t*100);document.getElementById("statTotal").textContent=t;document.getElementById("statCorrect").textContent=correctCount;document.getElementById("statRate").textContent=r+"%";let gt,gc;if(r===100){gt="🏆 满分！太厉害了！";gc="grade-perfect"}else if(r>=90){gt="🌟 优秀！继续保持！";gc="grade-excellent"}else if(r>=70){gt="👍 良好，还有进步空间";gc="grade-good"}else if(r>=60){gt="📚 及格，继续加油";gc="grade-fair"}else{gt="💪 加油，多练习就会进步";gc="grade-poor"}document.getElementById("resultTitle").textContent="📊 测试结果";let ge=document.getElementById("resultGrade");ge.textContent=gt;ge.className="result-grade "+gc;document.getElementById("resultPanel").classList.add("show");document.getElementById("resultPanel").scrollIntoView({behavior:"smooth",block:"center"})}
function restart(){QUESTION_COUNT=parseInt(document.getElementById("countSelect").value);loadQuiz();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("countSelect").addEventListener("change",restart);loadQuiz();
