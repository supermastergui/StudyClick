<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>语文古诗测试</title>

<style>
body {
    font-family: "Segoe UI", Arial;
    background: linear-gradient(135deg, #fff3e0, #e3f2fd);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
}

h1 {
    text-align: center;
}

.question {
    background: #fff;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.options button {
    display: block;

    border-radius: 8px;

    cursor: pointer;
}

.options button:hover {
    background: #e0e0e0;
}

.correct { background:#4CAF50 !important; color:#fff;}
.wrong { background:#f44336 !important; color:#fff;}

#result {
    text-align:center;
    font-size:18px;
    margin-top:20px;
}

    text-align:center;
    margin-top:20px;
}

#controls button {
    padding:10px 15px;
    margin:5px;

    border-radius:20px;
    background:#1976d2;
    color:#fff;
    cursor:pointer;

</style>
</head>

<body>

<div class="container">

<h1>📖 语文古诗测试</h1>

<div id="quiz"></div>
<div id="result"></div>

<div id="controls">
    <button onclick="restart()">🔁 再来一套</button>
    <button onclick="location.href='../index.html'">🏠 返回首页</button>
</div>

</div>

<script>

];

const QUESTION_COUNT = 10;

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

function loadQuiz(){
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "";

    let quizData = shuffle([...DATA]).slice(0, QUESTION_COUNT);
    let correctCount = 0;
    let answered = 0;

    quizData.forEach((item,index)=>{
        let [question, answer] = item;

        let wrongs = shuffle(DATA.filter(d=>d[1]!==answer))
            .slice(0,3)
            .map(d=>d[1]);

        let options = shuffle([answer,...wrongs]);

        let qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `<b>${index+1}. ${question}</b>`;

        let optDiv = document.createElement("div");
        optDiv.className = "options";

        options.forEach(opt=>{
            let btn = document.createElement("button");
            btn.innerText = opt;

            btn.onclick = function(){
                if(optDiv.classList.contains("done")) return;

                let buttons = optDiv.querySelectorAll("button");

                buttons.forEach(b=>{
                    if(b.innerText === answer){
                        b.classList.add("correct");
                    }
                    b.disabled = true;
                });

                if(opt !== answer){
                    btn.classList.add("wrong");
                } else {
                    correctCount++;
                }

                optDiv.classList.add("done");
                answered++;

                if(answered === quizData.length){
                    let acc = Math.round(correctCount / quizData.length *100);
                    document.getElementById("result").innerHTML =
                        `🎉 完成！正确率：${acc}%`;
                }
            };

            optDiv.appendChild(btn);
        });

        qDiv.appendChild(optDiv);
        document.getElementById("quiz").appendChild(qDiv);
    });
}

function restart(){
    loadQuiz();
}

loadQuiz();
</script>

</body>
</html>
