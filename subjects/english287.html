<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词测试 · 基础版</title>
<style>
/* ===== 全局 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e8eaf6 0%, #fce4ec 50%, #e0f2f1 100%);
    min-height: 100vh;
    padding: 20px;
}

.container { max-width: 780px; margin: 0 auto; }

/* ===== 头部 ===== */
.header { text-align: center; padding: 30px 20px 20px; }
.header h1 { font-size: 28px; color: #333; margin-bottom: 6px; }
.header .subtitle { color: #888; font-size: 13px; }

/* ===== 控制栏 ===== */
.control-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.control-bar label { font-size: 15px; color: #555; font-weight: 500; }
.control-bar select {
    padding: 8px 14px; border: 1px solid #ccc; border-radius: 10px;
    font-size: 15px; background: #fff; cursor: pointer; outline: none;
}
.control-bar select:focus { border-color: #5c6bc0; }
.control-bar button {
    padding: 9px 22px; border: none; border-radius: 20px;
    font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s;
}
.btn-start { background: #5c6bc0; color: #fff; }
.btn-start:hover { background: #3f51b5; }
.btn-reset { background: #ef5350; color: #fff; }
.btn-reset:hover { background: #d32f2f; }
.btn-home { background: #78909c; color: #fff; }
.btn-home:hover { background: #546e7a; }

/* ===== 进度条 ===== */
.progress-wrap { margin-bottom: 20px; }
.progress-text { font-size: 13px; color: #666; margin-bottom: 4px; text-align: center; }
.progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.progress-fill {
    height: 100%; background: linear-gradient(90deg, #5c6bc0, #26c6da);
    border-radius: 3px; transition: width 0.3s ease; width: 0%;
}

/* ===== 题目卡片 ===== */
.question {
    background: #fff; padding: 18px 20px; margin-bottom: 14px;
    border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.question:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.10); }
.question .q-title {
    font-size: 18px; font-weight: 600; color: #333; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
}
.q-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: #e8eaf6; color: #5c6bc0; font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.q-word { color: #1a237e; }

/* ===== 选项 ===== */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
.option-btn {
    display: block; width: 100%; padding: 11px 14px;
    border: 2px solid #e0e0e0; border-radius: 10px;
    background: #fafafa; cursor: pointer; font-size: 15px;
    color: #333; text-align: center; transition: all 0.18s;
}
.option-btn:hover { border-color: #5c6bc0; background: #e8eaf6; }
.option-btn:active { transform: scale(0.97); }
.option-btn.correct { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #1b5e20 !important; font-weight: 600; }
.option-btn.wrong { background: #ffcdd2 !important; border-color: #f44336 !important; color: #b71c1c !important; }
.question.done .option-btn { cursor: default; opacity: 0.75; }
.question.done .option-btn.correct { opacity: 1; }
.question.done .option-btn.wrong { opacity: 0.7; }

/* ===== 结果面板 ===== */
.result-panel {
    text-align: center; background: #fff; padding: 24px;
    border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-top: 20px; display: none;
}
.result-panel.show { display: block; animation: fadeUp 0.4s ease; }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}
.result-panel h2 { font-size: 22px; color: #333; margin-bottom: 12px; }
.result-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-item { text-align: center; }
.stat-value { font-size: 32px; font-weight: 700; color: #5c6bc0; }
.stat-label { font-size: 13px; color: #888; margin-top: 2px; }
.result-grade {
    font-size: 18px; font-weight: 600; margin-top: 8px;
    padding: 8px 20px; border-radius: 20px; display: inline-block;
}
.grade-perfect  { background: #c8e6c9; color: #1b5e20; }
.grade-excellent { background: #c8e6c9; color: #2e7d32; }
.grade-good      { background: #fff9c4; color: #f57f17; }
.grade-fair      { background: #ffe0b2; color: #e65100; }
.grade-poor      { background: #ffcdd2; color: #b71c1c; }

/* ===== 错题本 ===== */
.wrong-book {
    background: #fff; padding: 18px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-top: 20px;
}
.wrong-book h3 { margin-bottom: 10px; color: #333; }
.wrong-book ul { list-style: none; padding: 0; }
.wrong-book li {
    padding: 6px 10px; margin: 4px 0; background: #f5f5f5;
    border-radius: 6px; font-size: 14px;
}
.wrong-book .btn-clear {
    padding: 6px 14px; border: none; border-radius: 14px;
    background: #ef5350; color: #fff; cursor: pointer; font-size: 13px; margin-top: 8px;
}
.wrong-book .btn-clear:hover { background: #d32f2f; }

/* ===== 页脚 ===== */
.footer { text-align: center; margin-top: 30px; color: #aaa; font-size: 12px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📘 英语单词测试 · 基础版</h1>
        <div class="subtitle">1-287 · 随机抽题 · 点击作答 · 即时判分</div>
    </div>

    <div class="control-bar">
        <label for="countSelect">题量：</label>
        <select id="countSelect">
            <option value="10" selected>10 题</option>
            <option value="15">15 题</option>
            <option value="20">20 题</option>
            <option value="30">30 题</option>
        </select>
        <button class="btn-start" onclick="restart()">🔄 生成试卷</button>
    </div>

    <div class="progress-wrap">
        <div class="progress-text" id="progressText">未开始</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="quiz"></div>

    <div class="result-panel" id="resultPanel">
        <h2 id="resultTitle"></h2>
        <div class="result-stats">
            <div class="stat-item"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总题数</div></div>
            <div class="stat-item"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答对</div></div>
            <div class="stat-item"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正确率</div></div>
        </div>
        <div class="result-grade" id="resultGrade"></div>
    </div>

    <div class="wrong-book">
        <h3>📚 错题本</h3>
        <ul id="wrongList"><li style="color:#888">暂无错题</li></ul>
        <button class="btn-clear" onclick="clearWrong()">🗑 清空错题本</button>
    </div>

    <div class="footer"><button class="btn-home" onclick="location.href='../index.html'">🏠 返回首页</button>&nbsp;StudyClick · 点击式学习系统</div>
</div>

,"教堂"],["dull","乏味的"],["expense","花费"],["February","二月"],["government","政府"],["homeless","无家可归的"],["iron","铁"],["July","七月"],["kite","风筝"],["Australia","澳大利亚"],["breakfast","早饭"],["close","关"],["duty","责任"],["enter","进入"],["fog","雾"],["generally","一般地"],["heat","热量"],["improve","改善"],["Japan","日本"],["key","钥匙"],["address","地址"],["bath","洗澡"],["carrot","胡萝卜"],["die","死"],["enemy","敌人"],["farm","农场"],["gain","获得"],["hut","小屋"],["increase","增加"],["jam","果酱"],["knife","小刀"],["advice","劝告"],["bund","外滩"],["cough","咳嗽"],["debate","争论"],["ever","曾经"],["foot","脚"],["grow","生长"],["historical","历史的"],["independent","独立的"],["judge","法官"],["kilo=kilogram","公斤"],["accept","接受"],["boil","煮"],["choose","选择"],["decision","决定"],["elder","年长的"],["forever","永远"],["guest","客人"],["hold","握住"],["invite","邀请"],["juice","果汁"],["keyboard","键盘"],["advertisement","广告"],["beside","在……旁边"],["compare","比较"],["drop","掉"],["extend","伸出"],["fry","油炸"],["global","全球的"],["headline","标题"],["island","岛屿"],["keep","保持"],["ago","以前"],["brush","刷子"],["convenient","便利的"],["decorate","装饰"],["empty","空的"],["fuel","燃料"],["glass","玻璃"],["health","健康"],["introduce","介绍"],["actress","女演员"],["busy","忙"],["crowded","拥挤的"],["During","在…期间"],["eve","前夕"],["fable","寓言"],["gentleman","绅士"],["height","高度"],["Inside","在……里面"],["afford","担负得起"],["balance","平衡"],["cap","帽子"],["diary","日记"],["end","结束"],["Friday","星期五"],["graduate","毕业"],["human","人类的"],["item","项目"],["August","八月"],["brave","勇敢的"],["conductor","售票员"],["dig","挖"],["event","事件"],["fever","发烧"],["Germany","德国"],["holiday","假日"],["invitation","邀请"],["artist","艺术家"],["balloon","气球"],["culture","文化"],["departure","出发"],["envelope","信封"],["fit","适合"],["garden","花园"],["hide","隐藏"],["invent","发明"],["active","积极的"],["broadcast","广播"],["carry","携带"],["dream","梦想"],["Europe","欧洲"],["fence","栅栏"],["gas","煤气"],["housework","家务活"],["immediately","立刻"],["appear","出现"],["beg","请求"],["confuse","混淆"],["deliver","投递"],["economy","经济"],["fair","公平的"],["guide","导游"],["hall","大厅"],["include","包括"],["alive","活着的"],["beer","啤酒"],["channel","频道"],["develop","发展"],["engine","发动机"],["fine","美好的"],["gentle","温柔的"],["hurt","受伤"],["interest","兴趣"],["along","沿着"],["brief","简短的"],["contest","竞赛"],["depend","依靠"],["exactly","确切地"],["fix","修理"],["guess","猜测"],["high","高的"],["inch","英寸"],["argue","争论"],["bottle","瓶"],["cent","分"],["department","百货商店"],["each","每个"],["front","前面"],["geography","地理"],["hurry","急忙"],["interview","采访"],["alone","单独地"],["being","生物"],["correct","正确的"],["daily","日报"],["expect","期待"],["France","法国"],["grass","草"],["healthy","健康的"],["Internet","互联网"],["attend","出席"],["butter","黄油"],
];

let QUESTION_COUNT = 10;
let quizData = [];
let correctCount = 0;
let answeredCount = 0;

let wrongBook = JSON.parse(localStorage.getItem("wrongBook") || "[]");

function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function renderWrong() {
    const list = document.getElementById("wrongList");
    if (wrongBook.length === 0) {
        list.innerHTML = '<li style="color:#888">暂无错题</li>';
        return;
    }
    list.innerHTML = wrongBook.map(w => `<li>${w[0]} — ${w[1]}</li>`).join('');
}

function clearWrong() {
    wrongBook = [];
    localStorage.removeItem("wrongBook");
    renderWrong();
}

function loadQuiz() {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("resultPanel").classList.remove("show");
    document.getElementById("progressText").textContent = "0 / " + QUESTION_COUNT;
    document.getElementById("progressFill").style.width = "0%";

    quizData = shuffle(WORD_BANK).slice(0, QUESTION_COUNT);
    correctCount = 0;
    answeredCount = 0;

    const quizEl = document.getElementById("quiz");

    quizData.forEach((item, idx) => {
        const [word, correctDef] = item;

        const wrongDefs = shuffle(WORD_BANK.filter(w => w[1] !== correctDef))
            .slice(0, 3).map(w => w[1]);
        const options = shuffle([correctDef, ...wrongDefs]);

        const qDiv = document.createElement("div");
        qDiv.className = "question";

        const titleDiv = document.createElement("div");
        titleDiv.className = "q-title";
        titleDiv.innerHTML = `<span class="q-num">${idx + 1}</span><span class="q-word">${word}</span>`;
        qDiv.appendChild(titleDiv);

        const optGrid = document.createElement("div");
        optGrid.className = "options-grid";

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = opt;
            btn.addEventListener("click", () => handleAnswer(idx, opt, qDiv, optGrid, word, correctDef));
            optGrid.appendChild(btn);
        });

        qDiv.appendChild(optGrid);
        quizEl.appendChild(qDiv);
    });
}

function handleAnswer(idx, chosen, qDiv, optGrid, word, correctDef) {
    if (qDiv.classList.contains("done")) return;

    const buttons = optGrid.querySelectorAll(".option-btn");
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correctDef) btn.classList.add("correct");
    });

    if (chosen !== correctDef) {
        buttons.forEach(btn => {
            if (btn.textContent === chosen) btn.classList.add("wrong");
        });
        if (!wrongBook.some(w => w[0] === word)) {
            wrongBook.push([word, correctDef]);
            localStorage.setItem("wrongBook", JSON.stringify(wrongBook));
            renderWrong();
        }
    } else {
        correctCount++;
    }

    qDiv.classList.add("done");
    answeredCount++;

    const progressText = document.getElementById("progressText");
    const progressFill = document.getElementById("progressFill");
    progressText.textContent = answeredCount + " / " + QUESTION_COUNT;
    progressFill.style.width = (answeredCount / QUESTION_COUNT * 100) + "%";

    if (answeredCount === QUESTION_COUNT) {
        setTimeout(showResult, 300);
    }
}

function showResult() {
    const total = QUESTION_COUNT;
    const rate = Math.round(correctCount / total * 100);

    document.getElementById("statTotal").textContent = total;
    document.getElementById("statCorrect").textContent = correctCount;
    document.getElementById("statRate").textContent = rate + "%";

    let gradeText, gradeClass;
    if (rate === 100)      { gradeText = "🏆 满分！太厉害了！"; gradeClass = "grade-perfect"; }
    else if (rate >= 90)   { gradeText = "🌟 优秀！继续保持！"; gradeClass = "grade-excellent"; }
    else if (rate >= 70)   { gradeText = "👍 良好，还有进步空间"; gradeClass = "grade-good"; }
    else if (rate >= 60)   { gradeText = "📚 及格，继续加油"; gradeClass = "grade-fair"; }
    else                   { gradeText = "💪 加油，多练习就会进步"; gradeClass = "grade-poor"; }

    document.getElementById("resultTitle").textContent = "📊 测试结果";
    const gradeEl = document.getElementById("resultGrade");
    gradeEl.textContent = gradeText;
    gradeEl.className = "result-grade " + gradeClass;

    document.getElementById("resultPanel").classList.add("show");
    document.getElementById("resultPanel").scrollIntoView({ behavior: "smooth", block: "center" });
}

function restart() {
    QUESTION_COUNT = parseInt(document.getElementById("countSelect").value);
    loadQuiz();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("countSelect").addEventListener("change", restart);
loadQuiz();
renderWrong();
</script>

</body>
</html>
