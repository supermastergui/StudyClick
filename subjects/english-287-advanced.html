<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词测试 · 进阶版</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #e8eaf6 0%, #fce4ec 50%, #e0f2f1 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 780px; margin: 0 auto; }
.header { text-align: center; padding: 30px 20px 20px; }
.header h1 { font-size: 28px; color: #333; margin-bottom: 6px; }
.header .subtitle { color: #888; font-size: 13px; }
.control-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.control-bar label { font-size: 15px; color: #555; font-weight: 500; }
.control-bar select { padding: 8px 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; background: #fff; cursor: pointer; outline: none; }
.control-bar select:focus { border-color: #5c6bc0; }
.control-bar button { padding: 9px 22px; border: none; border-radius: 20px; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
.btn-start { background: #5c6bc0; color: #fff; } .btn-start:hover { background: #3f51b5; }
.btn-reset { background: #ef5350; color: #fff; } .btn-reset:hover { background: #d32f2f; }
.btn-home { background: #78909c; color: #fff; } .btn-home:hover { background: #546e7a; }
.progress-wrap { margin-bottom: 20px; }
.progress-text { font-size: 13px; color: #666; margin-bottom: 4px; text-align: center; }
.progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #5c6bc0, #26c6da); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
.question { background: #fff; padding: 18px 20px; margin-bottom: 14px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.question:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.10); }
.question .q-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.q-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: #e8eaf6; color: #5c6bc0; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.q-word { color: #1a237e; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
.option-btn { display: block; width: 100%; padding: 11px 14px; border: 2px solid #e0e0e0; border-radius: 10px; background: #fafafa; cursor: pointer; font-size: 15px; color: #333; text-align: center; transition: all 0.18s; }
.option-btn:hover { border-color: #5c6bc0; background: #e8eaf6; }
.option-btn:active { transform: scale(0.97); }
.option-btn.correct { background: #c8e6c9 !important; border-color: #4caf50 !important; color: #1b5e20 !important; font-weight: 600; }
.option-btn.wrong { background: #ffcdd2 !important; border-color: #f44336 !important; color: #b71c1c !important; }
.question.done .option-btn { cursor: default; opacity: 0.75; }
.question.done .option-btn.correct { opacity: 1; }
.question.done .option-btn.wrong { opacity: 0.7; }
.result-panel { text-align: center; background: #fff; padding: 24px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-top: 20px; display: none; }
.result-panel.show { display: block; animation: fadeUp 0.4s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.result-panel h2 { font-size: 22px; color: #333; margin-bottom: 12px; }
.result-stats { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-item { text-align: center; } .stat-value { font-size: 32px; font-weight: 700; color: #5c6bc0; } .stat-label { font-size: 13px; color: #888; margin-top: 2px; }
.result-grade { font-size: 18px; font-weight: 600; margin-top: 8px; padding: 8px 20px; border-radius: 20px; display: inline-block; }
.grade-perfect { background: #c8e6c9; color: #1b5e20; } .grade-excellent { background: #c8e6c9; color: #2e7d32; }
.grade-good { background: #fff9c4; color: #f57f17; } .grade-fair { background: #ffe0b2; color: #e65100; } .grade-poor { background: #ffcdd2; color: #b71c1c; }
.wrong-book { background: #fff; padding: 18px; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-top: 20px; }
.wrong-book h3 { margin-bottom: 10px; color: #333; }
.wrong-book ul { list-style: none; padding: 0; }
.wrong-book li { padding: 6px 10px; margin: 4px 0; background: #f5f5f5; border-radius: 6px; font-size: 14px; }
.wrong-book .btn-clear { padding: 6px 14px; border: none; border-radius: 14px; background: #ef5350; color: #fff; cursor: pointer; font-size: 13px; margin-top: 8px; }
.wrong-book .btn-clear:hover { background: #d32f2f; }
.footer { text-align: center; margin-top: 30px; color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>📘 英语单词测试 · 进阶版</h1><div class="subtitle">1-287 · 进阶词汇 · 随机抽题 · 点击作答</div></div>
<div class="control-bar">
<label for="countSelect">题量：</label>
<select id="countSelect"><option value="10" selected>10 题</option><option value="15">15 题</option><option value="20">20 题</option><option value="30">30 题</option></select>
<button class="btn-start" onclick="restart()">🔄 生成试卷</button>
</div>
<div class="progress-wrap"><div class="progress-text" id="progressText">未开始</div><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div></div>
<div id="quiz"></div>
<div class="result-panel" id="resultPanel"><h2 id="resultTitle"></h2><div class="result-stats"><div class="stat-item"><div class="stat-value" id="statTotal">0</div><div class="stat-label">总题数</div></div><div class="stat-item"><div class="stat-value" id="statCorrect">0</div><div class="stat-label">答对</div></div><div class="stat-item"><div class="stat-value" id="statRate">0%</div><div class="stat-label">正确率</div></div></div><div class="result-grade" id="resultGrade"></div></div>
<div class="wrong-book"><h3>📚 错题本</h3><ul id="wrongList"><li style="color:#888">暂无错题</li></ul><button class="btn-clear" onclick="clearWrong()">🗑 清空错题本</button></div>
<div class="footer"><button class="btn-home" onclick="location.href='../index.html'">🏠 返回首页</button>&nbsp;StudyClick · 点击式学习系统</div>
</div>
<script>
const WORD_BANK = [
["above","在…面"],["burn","燃烧"],["chest","胸"],["desert","沙漠"],["hesitate","犹豫"],["individual","个人的"],["abroad","在国外"],["indeed","的确"],["forecast","预报"],["available","可用的"],["cotton","棉花"],["examine","检查"],["fetch","取"],["group","小组"],["junior","初级的"],["ink","墨水"],["cigarette","香烟"],["electronic","电子的"],["efficient","高效的"],["conversation","谈话"],["degree","学位"],["fax","传真"],["iron","铁"],["duty","责任"],["fog","雾"],["enemy","敌人"],["hut","小屋"],["bund","外滩"],["forever","永远"],["advertisement","广告"],["extend","伸出"],["headline","标题"],["convenient","便利的"],["fable","寓言"],["diary","日记"],["graduate","毕业"],["conductor","售票员"],["envelope","信封"],["broadcast","广播"],["gas","煤气"],["brief","简短的"],["department","百货商店"],["geography","地理"],["butter","黄油"],
];
let QUESTION_COUNT = 10, quizData = [], correctCount = 0, answeredCount = 0;
let wrongBook = JSON.parse(localStorage.getItem("wrongBook") || "[]");
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function renderWrong(){let l=document.getElementById("wrongList");if(wrongBook.length===0){l.innerHTML='<li style="color:#888">暂无错题</li>';return}l.innerHTML=wrongBook.map(w=>`<li>${w[0]} — ${w[1]}</li>`).join('')}
function clearWrong(){wrongBook=[];localStorage.removeItem("wrongBook");renderWrong()}
function loadQuiz(){document.getElementById("quiz").innerHTML="";document.getElementById("resultPanel").classList.remove("show");document.getElementById("progressText").textContent="0 / "+QUESTION_COUNT;document.getElementById("progressFill").style.width="0%";quizData=shuffle(WORD_BANK).slice(0,QUESTION_COUNT);correctCount=0;answeredCount=0;let qe=document.getElementById("quiz");quizData.forEach((item,idx)=>{let[word,correctDef]=item;let wrongs=shuffle(WORD_BANK.filter(w=>w[1]!==correctDef)).slice(0,3).map(w=>w[1]);let opts=shuffle([correctDef,...wrongs]);let qDiv=document.createElement("div");qDiv.className="question";let td=document.createElement("div");td.className="q-title";td.innerHTML=`<span class="q-num">${idx+1}</span><span class="q-word">${word}</span>`;qDiv.appendChild(td);let og=document.createElement("div");og.className="options-grid";opts.forEach(opt=>{let btn=document.createElement("button");btn.className="option-btn";btn.textContent=opt;btn.addEventListener("click",()=>handleAnswer(idx,opt,qDiv,og,word,correctDef));og.appendChild(btn)});qDiv.appendChild(og);qe.appendChild(qDiv)})}
function handleAnswer(idx,chosen,qDiv,og,word,correctDef){if(qDiv.classList.contains("done"))return;let btns=og.querySelectorAll(".option-btn");btns.forEach(btn=>{btn.disabled=true;if(btn.textContent===correctDef)btn.classList.add("correct")});if(chosen!==correctDef){btns.forEach(btn=>{if(btn.textContent===chosen)btn.classList.add("wrong")});if(!wrongBook.some(w=>w[0]===word)){wrongBook.push([word,correctDef]);localStorage.setItem("wrongBook",JSON.stringify(wrongBook));renderWrong()}}else{correctCount++}qDiv.classList.add("done");answeredCount++;let pt=document.getElementById("progressText"),pf=document.getElementById("progressFill");pt.textContent=answeredCount+" / "+QUESTION_COUNT;pf.style.width=(answeredCount/QUESTION_COUNT*100)+"%";if(answeredCount===QUESTION_COUNT)setTimeout(showResult,300)}
function showResult(){let t=QUESTION_COUNT,r=Math.round(correctCount/t*100);document.getElementById("statTotal").textContent=t;document.getElementById("statCorrect").textContent=correctCount;document.getElementById("statRate").textContent=r+"%";let gt,gc;if(r===100){gt="🏆 满分！太厉害了！";gc="grade-perfect"}else if(r>=90){gt="🌟 优秀！继续保持！";gc="grade-excellent"}else if(r>=70){gt="👍 良好，还有进步空间";gc="grade-good"}else if(r>=60){gt="📚 及格，继续加油";gc="grade-fair"}else{gt="💪 加油，多练习就会进步";gc="grade-poor"}document.getElementById("resultTitle").textContent="📊 测试结果";let ge=document.getElementById("resultGrade");ge.textContent=gt;ge.className="result-grade "+gc;document.getElementById("resultPanel").classList.add("show");document.getElementById("resultPanel").scrollIntoView({behavior:"smooth",block:"center"})}
function restart(){QUESTION_COUNT=parseInt(document.getElementById("countSelect").value);loadQuiz();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("countSelect").addEventListener("change",restart);loadQuiz();renderWrong();
</script>
</body>
</html>
